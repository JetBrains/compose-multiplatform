// Resolves Maven Central artifacts through JetBrains cache-redirector, to avoid hitting Maven Central rate limits (HTTP 429) on CI.
// Used by Gradle plugin tests (TestProject.kt) and examples/validateExamples*.sh, the projects themselves don't depend on it.
// The redirector has to go before Gradle Plugin Portal, as the portal redirects such artifacts to Maven Central.

def redirectorName = "MavenCentralCacheRedirector"
def redirectorUrl = "https://cache-redirector.jetbrains.com/maven-central"

// Artifacts of a fresh Compose Hot Reload release are not available in the cache-redirector immediately
// (it negatively caches missing artifacts), so they fall back to direct Maven Central, after the redirector.
// The content filter keeps all other artifacts on the redirector (see the 429 note above).
// repo1.maven.org is used intentionally: its host differs from repo.maven.apache.org,
// so these repositories are not removed/replaced by the logic below.
def hotReloadRepoName = "MavenCentralHotReload"
def hotReloadRepoUrl = "https://repo1.maven.org/maven2"
def hotReloadGroup = "org.jetbrains.compose.hot-reload"

beforeSettings { settings ->
    // Repositories declared in settings scripts are added after these
    settings.pluginManagement.repositories.maven {
        name = redirectorName
        url = redirectorUrl
    }
    settings.dependencyResolutionManagement.repositories.maven {
        name = redirectorName
        url = redirectorUrl
    }
    settings.pluginManagement.repositories.maven {
        name = hotReloadRepoName
        url = hotReloadRepoUrl
        content {
            includeGroup(hotReloadGroup)
        }
    }
    settings.dependencyResolutionManagement.repositories.maven {
        name = hotReloadRepoName
        url = hotReloadRepoUrl
        content {
            includeGroup(hotReloadGroup)
        }
    }
}

settingsEvaluated { settings ->
    // Direct Maven Central is replaced by the redirector above:
    // on 429 it fails the resolution instead of falling through to the next repositories (e.g. mavenLocal with snapshots)
    [settings.pluginManagement.repositories, settings.dependencyResolutionManagement.repositories].each { repositories ->
        repositories.removeAll { it instanceof MavenArtifactRepository && it.url.host == "repo.maven.apache.org" }

        // Gradle Plugin Portal redirects artifacts it doesn't host (e.g. AGP from Google Maven) to Maven Central,
        // so it goes last for other repositories to be checked first
        def pluginPortals = repositories.findAll { it instanceof MavenArtifactRepository && it.url.host == "plugins.gradle.org" }
        repositories.removeAll(pluginPortals)
        pluginPortals.each { repositories.addLast(it) }
    }
}

gradle.lifecycle.beforeProject { project ->
    // Some projects declare repositories in build scripts, there direct Maven Central is redirected in place
    project.repositories.configureEach { repository ->
        if (repository instanceof MavenArtifactRepository && repository.url.host == "repo.maven.apache.org") {
            repository.url = redirectorUrl
        }
    }
}
