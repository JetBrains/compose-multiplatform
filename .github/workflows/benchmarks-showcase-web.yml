name: Compile showcase web targets

on:
  pull_request:
    paths:
      - 'benchmarks/showcases/LazyGridImageView/**'
      - '.github/workflows/benchmarks-showcase-web.yml'
  push:
    branches:
      - master
    paths:
      - 'benchmarks/showcases/LazyGridImageView/**'
      - '.github/workflows/benchmarks-showcase-web.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS and Wasm targets
        working-directory: benchmarks/showcases/LazyGridImageView
        run: ./gradlew :composeApp:compileKotlinJs :composeApp:compileKotlinWasmJs
