name: Test Gradle plugin
on:
  pull_request:
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'
  push:
    branches:
      - master
    paths:
      - 'gradle-plugins/**'
      - '.github/workflows/gradle-plugin.yml'

jobs:
  test-gradle-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-26-xlarge', 'windows-2022']
        gradle: ['9.3.1', '9.5.0']
        agp: ['9.1.1', '9.2.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # TODO https://github.com/actions/setup-java/issues/1317 Remove this workaround when setup-java supports the fixed JBR release.
      - name: Download JBR 25.0.4.1
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) jbr_platform=linux-x64 ;;
            macOS-ARM64) jbr_platform=osx-aarch64 ;;
            Windows-X64) jbr_platform=windows-x64 ;;
            *) echo "Unsupported runner: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.4.1-${jbr_platform}-b635.79.tar.gz" \
            --output "$RUNNER_TEMP/jbr.tar.gz"

      - name: Setup JBR 25
        uses: actions/setup-java@v6
        with:
          distribution: 'jdkfile'
          # setup-java requires a three-component SemVer for its tool-cache key.
          java-version: '25.0.4+635.79'
          jdk-file: ${{ runner.temp }}/jbr.tar.gz
          force-download: true

      - name: Verify JBR version
        shell: bash
        run: |
          java_version=$(java -version 2>&1)
          printf '%s\n' "$java_version"
          printf '%s\n' "$java_version" | grep -E 'JBR-25\.0\.4\.1.*635\.79'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only save Gradle User Home state for builds on the 'master' branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

          # Limit the size of the cache entry.
          # These directories contain instrumented/transformed dependency jars which can be reconstructed relatively quickly.
          gradle-home-cache-excludes: |
            caches/jars-9
            caches/transforms-3

      - name: Test Gradle plugin
        shell: bash
        working-directory: gradle-plugins
        run: |
          ./gradlew --continue check -Pcompose.tests.gradle.versions=${{ matrix.gradle }} -Pcompose.tests.agp.versions=${{ matrix.agp }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports-${{ matrix.os }}-Gradle-${{ matrix.gradle }}-Agp${{ matrix.agp }}
          path: gradle-plugins/compose/build/reports
        if: always()

      - name: Print summary
        shell: bash
        working-directory: gradle-plugins
        if: always()
        run: |
          if [[ ! -d compose/build/test-summary ]]; then
            exit 0
          fi

          cd compose/build/test-summary
          for SUMMARY_FILE in `find . -name "*.md"`; do
            FILE_NAME=`basename $SUMMARY_FILE`
            echo "## $FILE_NAME" >> $GITHUB_STEP_SUMMARY
            cat $SUMMARY_FILE >> $GITHUB_STEP_SUMMARY
          done
