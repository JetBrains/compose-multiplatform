name: "components"

on:
  pull_request:
    paths:
      - 'components/**'
      - '.github/workflows/components.yml'
  push:
    branches:
      - master
    paths:
      - 'components/**'
      - '.github/workflows/components.yml'

jobs:
  compile-jvm-android-web:
    name: Compile JVM, Android, JS and Wasm targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile desktop JVM targets
        working-directory: components
        run: ./gradlew compileKotlinDesktop compileKotlinJvm
      - name: Compile Android targets
        working-directory: components
        run: ./gradlew compileAndroidMain :resources:demo:androidApp:compileDebugKotlin
      - name: Compile JS and Wasm targets
        working-directory: components
        run: ./gradlew compileKotlinJs compileKotlinWasmJs

  compile-apple:
    name: Compile iOS and macOS targets
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile iOS and macOS targets
        working-directory: components
        run: ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 compileKotlinMacosArm64
