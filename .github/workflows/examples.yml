name: Validate examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:
    inputs:
      compose_version:
        description: 'Optional Compose Multiplatform version to validate'
        required: false
        type: string
      kotlin_version:
        description: 'Optional Kotlin version to validate with the Compose version'
        required: false
        type: string

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate version inputs
        run: |
          if [[ -n "${{ inputs.kotlin_version }}" && -z "${{ inputs.compose_version }}" ]]; then
            echo "kotlin_version requires compose_version."
            exit 1
          fi

  desktop:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate desktop examples
        working-directory: examples
        run: |
          if [[ -n "${{ inputs.kotlin_version }}" ]]; then
            ./validateExamplesDesktop.sh "${{ inputs.compose_version }}" "${{ inputs.kotlin_version }}"
          elif [[ -n "${{ inputs.compose_version }}" ]]; then
            ./validateExamplesDesktop.sh "${{ inputs.compose_version }}"
          else
            ./validateExamplesDesktop.sh
          fi

  web:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate web examples
        working-directory: examples
        run: |
          if [[ -n "${{ inputs.kotlin_version }}" ]]; then
            ./validateExamplesWeb.sh "${{ inputs.compose_version }}" "${{ inputs.kotlin_version }}"
          elif [[ -n "${{ inputs.compose_version }}" ]]; then
            ./validateExamplesWeb.sh "${{ inputs.compose_version }}"
          else
            ./validateExamplesWeb.sh
          fi

  android:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '17'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 37.1
        run: sdkmanager "platforms;android-37-ext1"

      - name: Validate Android examples
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          script: |
            cd examples
            if [[ -n "${{ inputs.kotlin_version }}" ]]; then
              ./validateExamplesAndroid.sh "${{ inputs.compose_version }}" "${{ inputs.kotlin_version }}"
            elif [[ -n "${{ inputs.compose_version }}" ]]; then
              ./validateExamplesAndroid.sh "${{ inputs.compose_version }}"
            else
              ./validateExamplesAndroid.sh
            fi

  ios:
    needs: validate-inputs
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate iOS examples
        working-directory: examples
        run: |
          if [[ -n "${{ inputs.kotlin_version }}" ]]; then
            ./validateExamplesIos.sh "${{ inputs.compose_version }}" "${{ inputs.kotlin_version }}"
          elif [[ -n "${{ inputs.compose_version }}" ]]; then
            ./validateExamplesIos.sh "${{ inputs.compose_version }}"
          else
            ./validateExamplesIos.sh
          fi
