name: "benchmarks: Build and run"

on:
  pull_request:
    paths:
      - 'benchmarks/**'
  push:
    branches:
      - master
    paths:
      - 'benchmarks/**'

jobs:
  benchmarks-macos-arm64:
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: K/Native MacOS arm64
        shell: bash
        run: |
          cd benchmarks/multiplatform
          ./gradlew :benchmarks:runReleaseExecutableMacosArm64

  benchmarks-desktop-jvm:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '17'
    - name: Desktop/JVM target
      shell: bash
      run: |
        cd benchmarks/multiplatform
        ./gradlew :benchmarks:run

  benchmarks-wasm-d8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: K/Wasm D8
        shell: bash
        run: |
          cd benchmarks/multiplatform
          ./gradlew :benchmarks:wasmJsD8ProductionRun compileKotlinJs

  showcase-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS and Wasm targets
        working-directory: benchmarks/showcases/LazyGridImageView
        run: ./gradlew :composeApp:compileKotlinJs :composeApp:compileKotlinWasmJs
