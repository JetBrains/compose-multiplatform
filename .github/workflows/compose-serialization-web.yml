name: Compile Compose serialization web target

on:
  pull_request:
    paths:
      - 'compose/integrations/compose-with-ktx-serialization/**'
      - '.github/workflows/compose-serialization-web.yml'
  push:
    branches:
      - master
    paths:
      - 'compose/integrations/compose-with-ktx-serialization/**'
      - '.github/workflows/compose-serialization-web.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS target
        working-directory: compose/integrations/compose-with-ktx-serialization
        run: bash ./gradlew :common:compileKotlinJs
