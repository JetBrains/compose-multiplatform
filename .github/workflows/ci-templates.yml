name: "ci/templates: Compile templates"

on:
  pull_request:
    paths:
      - 'ci/templates/**'
      - '.github/workflows/ci-templates.yml'
  push:
    branches:
      - master
    paths:
      - 'ci/templates/**'
      - '.github/workflows/ci-templates.yml'

jobs:
  html-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS target
        working-directory: ci/templates/html-library-template
        run: ./gradlew compileKotlinJs

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop template
        working-directory: ci/templates/desktop-template
        run: ./gradlew compileKotlin

  multiplatform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop targets
        working-directory: ci/templates/multiplatform-template
        run: ./gradlew :common:compileKotlinDesktop :desktop:compileKotlinJvm
      - name: Compile Android targets
        working-directory: ci/templates/multiplatform-template
        run: ./gradlew :common:compileDebugKotlinAndroid :android:compileDebugKotlin

  maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile Maven project
        working-directory: ci/templates/maven-test-project
        run: mvn -B compile
