name: "ci/templates: Compile HTML library web target"

on:
  pull_request:
    paths:
      - 'ci/templates/**'
  push:
    branches:
      - master
    paths:
      - 'ci/templates/**'

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS target
        working-directory: ci/templates/html-library-template
        run: ./gradlew compileKotlinJs
