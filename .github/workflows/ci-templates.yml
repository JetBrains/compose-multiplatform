name: "ci/templates"

on:
  pull_request:
    paths:
      - 'ci/templates/**'
      - '.github/workflows/ci-templates.yml'
  push:
    branches:
      - master
    paths:
      - 'ci/templates/**'
      - '.github/workflows/ci-templates.yml'

jobs:
  html-library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile JS target
        working-directory: ci/templates/html-library-template
        run: ./gradlew compileKotlinJs

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile desktop template
        working-directory: ci/templates/desktop-template
        run: ./gradlew compileKotlin

  multiplatform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile desktop targets
        working-directory: ci/templates/multiplatform-template
        run: ./gradlew :common:compileKotlinDesktop :desktop:compileKotlinJvm
      - name: Compile Android targets
        working-directory: ci/templates/multiplatform-template
        run: ./gradlew :common:compileAndroidMain :android:compileDebugKotlin

  maven:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Maven 3.9.13
        shell: bash
        run: |
          # Maven 3.10 rejects conflicting transitive lifecycle constraints in Compose's POMs.
          archive="$RUNNER_TEMP/apache-maven-3.9.13-bin.tar.gz"
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.13/binaries/apache-maven-3.9.13-bin.tar.gz -o "$archive"
          echo "d9ccd44ba2991586e359c29eb86780ae8ff4ec1b88b0b8af3af074803472690cf2017782a9c4401343c62cbcd056231db9612e1e551cbd9747c21746d732c015  $archive" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.13/bin" >> "$GITHUB_PATH"
      - name: Compile Maven project
        working-directory: ci/templates/maven-test-project
        run: mvn -B compile
