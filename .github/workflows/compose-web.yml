name: "compose: Compile integration web targets"

on:
  pull_request:
    paths:
      - 'compose/**'
      - '.github/workflows/compose-web.yml'
  push:
    branches:
      - master
    paths:
      - 'compose/**'
      - '.github/workflows/compose-web.yml'

jobs:
  composable-test-cases:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS and Wasm targets
        working-directory: compose/integrations/composable-test-cases
        run: ./gradlew compileKotlinJs compileKotlinWasmJs

  serialization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS target
        working-directory: compose/integrations/compose-with-ktx-serialization
        run: bash ./gradlew :common:compileKotlinJs
