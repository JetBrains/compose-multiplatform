name: Compose HTML EAP

on:
  pull_request:
    paths:
      - 'html/eap/**'
      - 'html/test-utils/**'
      - 'html/kotlin-js-store/yarn.lock'
      - 'html/build.gradle.kts'
      - 'html/settings.gradle.kts'
      - 'html/gradle.properties'
      - 'html/buildSrc/**'
      - 'html/gradle/**'
      - '.github/workflows/compose-html-eap.yml'
  push:
    branches:
      - master
    paths:
      - 'html/eap/**'
      - 'html/test-utils/**'
      - 'html/kotlin-js-store/yarn.lock'
      - 'html/build.gradle.kts'
      - 'html/settings.gradle.kts'
      - 'html/gradle.properties'
      - 'html/buildSrc/**'
      - 'html/gradle/**'
      - '.github/workflows/compose-html-eap.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup JDK 11 for compiler test harness
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and publish Compose HTML EAP artifacts to Maven Local
        working-directory: html
        run: |
          ./gradlew --no-daemon --stacktrace --rerun-tasks --max-workers=1 \
            -Pcompose.html.eap.enabled=true \
            :html-core-eap:check \
            :html-svg-eap:check \
            :internal-html-core-runtime-eap:check \
            :internal-html-serialization-eap:check \
            :html-core-eap:publishToMavenLocal \
            :html-svg-eap:publishToMavenLocal \
            :internal-html-core-runtime-eap:publishToMavenLocal \
            :internal-html-serialization-eap:publishToMavenLocal

      - name: Test HTML compiler and Gradle plugins, including browser hydration
        working-directory: html
        run: |
          ./gradlew --no-daemon --stacktrace --max-workers=1 \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64 \
            -Pcompose.html.eap.enabled=true :compose-html-compiler-plugin:check
