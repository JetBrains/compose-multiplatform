name: Compile Compose test-case web targets

on:
  pull_request:
    paths:
      - 'compose/integrations/composable-test-cases/**'
      - '.github/workflows/composable-test-cases-web.yml'
  push:
    branches:
      - master
    paths:
      - 'compose/integrations/composable-test-cases/**'
      - '.github/workflows/composable-test-cases-web.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile JS and Wasm targets
        working-directory: compose/integrations/composable-test-cases
        run: ./gradlew compileKotlinJs compileKotlinWasmJs
