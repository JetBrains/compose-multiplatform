name: Compile Compose HTML web targets

on:
  pull_request:
    paths:
      - 'html/benchmark-core/**'
      - 'html/build.gradle.kts'
      - 'html/buildSrc/**'
      - 'html/compose-compiler-integration/**'
      - 'html/core/**'
      - 'html/gradle/**'
      - 'html/gradle.properties'
      - 'html/gradlew*'
      - 'html/integration-core/**'
      - 'html/internal-html-core-runtime/**'
      - 'html/settings.gradle.kts'
      - 'html/svg/**'
      - 'html/test-utils/**'
      - '.github/workflows/compose-html-web.yml'
  push:
    branches:
      - master
    paths:
      - 'html/benchmark-core/**'
      - 'html/build.gradle.kts'
      - 'html/buildSrc/**'
      - 'html/compose-compiler-integration/**'
      - 'html/core/**'
      - 'html/gradle/**'
      - 'html/gradle.properties'
      - 'html/gradlew*'
      - 'html/integration-core/**'
      - 'html/internal-html-core-runtime/**'
      - 'html/settings.gradle.kts'
      - 'html/svg/**'
      - 'html/test-utils/**'
      - '.github/workflows/compose-html-web.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile HTML JS targets
        working-directory: html
        run: ./gradlew compileKotlinJs
      - name: Compile nested integration template JS target
        working-directory: html/compose-compiler-integration/main-template
        run: |
          kotlin_version=$(sed -n 's/^kotlin.version=//p' ../../buildSrc/gradle.properties)
          compose_version=$(sed -n 's/^compose.version=//p' ../../gradle.properties)
          bash ./gradlew compileKotlinJs "-Pkotlin.version=$kotlin_version" "-Pcompose.version=$compose_version"
