import org.jetbrains.compose.IosRenderingBackend

plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.compose"
}

kotlin {
    iosArm64()
    iosSimulatorArm64()
    sourceSets {
        commonMain {
            dependencies {
                implementation("org.jetbrains.compose.ui:ui:COMPOSE_VERSION_PLACEHOLDER")
            }
        }
    }
}

def backend = providers.gradleProperty("backend").orNull
if (backend != null) {
    compose {
        ios {
            renderingBackend = backend == "Graphite" ? IosRenderingBackend.Graphite : IosRenderingBackend.Ganesh
        }
    }
}
