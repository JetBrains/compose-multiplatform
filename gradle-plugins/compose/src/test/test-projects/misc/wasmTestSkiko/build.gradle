import org.jetbrains.kotlin.gradle.targets.js.nodejs.NodeJsEnvSpec
import org.jetbrains.kotlin.gradle.targets.js.nodejs.NodeJsPlugin
import org.jetbrains.kotlin.gradle.targets.wasm.nodejs.WasmNodeJsEnvSpec
import org.jetbrains.kotlin.gradle.targets.wasm.nodejs.WasmNodeJsPlugin

plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.compose"
}

kotlin {
    wasm {
        browser()
        binaries.executable()
    }
    js {
        browser()
        binaries.executable()
    }
    sourceSets {
        commonTest {
            dependencies {
                implementation(kotlin("test"))
                implementation("org.jetbrains.compose.ui:ui-test:COMPOSE_VERSION_PLACEHOLDER")
            }
        }
    }
}

allprojects { subproject ->
    subproject.plugins.withType(NodeJsPlugin).configureEach {
        subproject.extensions.getByType(NodeJsEnvSpec).version.set(libs.versions.node)
    }
    subproject.plugins.withType(WasmNodeJsPlugin).configureEach {
        subproject.extensions.getByType(WasmNodeJsEnvSpec).version.set(libs.versions.node)
    }
}
